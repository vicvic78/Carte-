<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes</title>
<style>
:root{--bg:#09090b;--fg:#fff;--mut:#9ca3af;--glass:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Inter","Segoe UI",system-ui,sans-serif;max-width:480px;margin-inline:auto;min-height:100vh;padding-bottom:110px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 14px;position:relative}
.cat{background:none;border:0;color:var(--fg);font:700 22px inherit;font-family:inherit;display:flex;align-items:center;gap:6px;cursor:pointer}
.ic{background:none;border:0;color:var(--fg);cursor:pointer;padding:4px}
.menu{position:absolute;top:60px;left:16px;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:6px;z-index:5;display:none;min-width:170px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:500 16px inherit;font-family:inherit;padding:11px 14px;border-radius:10px;cursor:pointer}
.menu button:hover,.menu button.sel{background:#27272a}
.list{padding:0 20px;display:flex;flex-direction:column;gap:14px}
.card{position:relative;height:190px;border-radius:26px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.35),transparent 60%)}
.pill{position:absolute;top:14px;left:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;font-size:14px}
.big{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:68px;font-weight:800;letter-spacing:-2px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0 10px}
.row{display:flex;justify-content:space-between;align-items:center;background:#18181b;border-radius:18px;padding:16px 18px}
.row small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:50px 20px}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:flex;justify-content:space-around;padding:14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22)}
nav button{background:none;border:0;color:rgba(255,255,255,.65);cursor:pointer;display:flex;flex-direction:column;align-items:center;font:11px inherit;font-family:inherit;gap:3px}
nav button.on{color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.panel{background:#131316;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.panel h2{margin:0 0 14px;font-size:20px}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 6px}
input,select{width:100%;background:#1f1f23;border:1px solid #2e2e33;border-radius:12px;color:#fff;padding:13px;font-size:16px;font-family:inherit}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw span{width:44px;height:44px;border-radius:12px;cursor:pointer;border:3px solid transparent}
.btn.ghost{background:#27272a;color:#fff;margin-top:12px}
.sw span.on{border-color:#fff}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#fff;color:#000;font:700 16px inherit;font-family:inherit;cursor:pointer}
.btn.red{background:#3f1d1d;color:#fca5a5;margin-top:10px}
.note{color:var(--mut);font-size:12px;margin-top:10px;line-height:1.4}
.d{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #27272a}
.d span:first-child{color:var(--mut)}

body{background:radial-gradient(90% 40% at 100% 0%,rgba(56,189,248,.14),transparent 70%),radial-gradient(80% 35% at 0% 20%,rgba(167,139,250,.12),transparent 70%),var(--bg);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
header{padding-bottom:4px}
.hero{padding:6px 20px 18px}
.hero h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-1.2px}
.hero p{margin:4px 0 0;color:var(--mut);font-size:15px}
.card{box-shadow:0 14px 30px -12px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.14);animation:in .45s cubic-bezier(.2,.8,.2,1) backwards}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 35%);pointer-events:none}
.chip{position:absolute;left:18px;top:68px;width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#b45309);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);opacity:.9}
.chip::before{content:"";position:absolute;inset:6px 0;border-top:1px solid rgba(0,0,0,.3);border-bottom:1px solid rgba(0,0,0,.3)}
.row{border:1px solid #232328;animation:in .4s backwards}
.row b.warn{color:#fbbf24}.row b.bad{color:#f87171}
.sheet{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.panel{animation:up .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.panel::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#3f3f46;margin:-8px auto 16px}
nav{box-shadow:0 12px 40px rgba(0,0,0,.6)}
nav button{transition:color .2s,transform .2s;padding:2px 14px}
nav button.on{transform:translateY(-1px)}
nav button.on svg{filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
input:focus,select:focus{outline:2px solid #38bdf8;outline-offset:1px}
.btn:active{transform:scale(.98)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.hero h1{background:linear-gradient(90deg,#fff,#a5b4fc 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.acts{display:flex;gap:10px;align-items:center}
.ic{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;padding:0}
.ic.on{background:#fff;color:#000}
.nm{display:none}
.stack .nm{display:inline;font-weight:700}
.list.stack{gap:0}
.list.stack .card{margin-top:-118px;height:200px;box-shadow:0 -10px 24px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14)}
.list.stack .card:first-child{margin-top:0}
.list.stack .big{display:none}
.nfc{position:absolute;right:18px;top:18px;opacity:.85}
.card{transition:transform .15s ease-out;will-change:transform}
nav button.on{background:rgba(255,255,255,.16);border-radius:99px}
.card::after{background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 35%),url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200%200%200%20.22%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E)}
.pill{font-weight:500;letter-spacing:.2px}
.big{text-shadow:0 2px 20px rgba(0,0,0,.25)}
html,body{background:#09090b}
</style>
</head>
<body>
<header>
  <button class="cat" id="catBtn"><span id="catLbl">Toutes</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="acts"><button class="ic" id="stBtn" aria-label="Pile de cartes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="8" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/></svg></button><button class="ic" id="calBtn" aria-label="Échéances">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></button></div>
  <div class="menu" id="menu"></div>
</header>
<div class="hero"><h1>Cartes</h1><p id="sub"></p></div>
<main class="list" id="list"></main>

<nav>
  <button class="on" id="tCards"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>Cartes</button>
  <button id="tAdd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Ajouter</button>
  <button id="tDates"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Échéances</button>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
const CATS=["Banque","Fidélité","Transport","Identité"];
const COLORS=["linear-gradient(160deg,#0284c7,#1e3a8a)","linear-gradient(160deg,#6b8f4e,#2f4a2a)","linear-gradient(160deg,#ea7a2b,#7c2d12)","linear-gradient(160deg,#a78bfa,#4c1d95)","linear-gradient(160deg,#374151,#0b0b0d)","radial-gradient(80% 60% at 20% 20%,#34d399aa,transparent),radial-gradient(70% 60% at 85% 30%,#a78bfaaa,transparent),radial-gradient(80% 70% at 50% 100%,#38bdf8aa,transparent),#0b1020","radial-gradient(rgba(255,255,255,.25) 2px,transparent 2.5px) 0 0/18px 18px,linear-gradient(160deg,#1d4ed8,#0f172a)","repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 8px,transparent 8px 22px),linear-gradient(160deg,#e11d48,#7f1d1d)","radial-gradient(120% 50% at 30% 105%,rgba(255,255,255,.3) 0 40%,transparent 41%),radial-gradient(120% 50% at 80% 115%,rgba(255,255,255,.2) 0 45%,transparent 46%),linear-gradient(180deg,#22d3ee,#0369a1)","linear-gradient(rgba(34,197,94,.35) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(34,197,94,.35) 1px,transparent 1px) 0 0/24px 24px,#02140a","linear-gradient(180deg,#fde047,#f97316 45%,#9d174d)","url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20400%20260%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%230284c7%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%230c4a6e%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27400%27%20height%3D%27260%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Cpath%20d%3D%27M0%20260V190L110%2090%20160%20130%20250%2050%20400%20200V260Z%27%20fill%3D%27%23cbd5e1%27%2F%3E%3Cpath%20d%3D%27M250%2050L214%2096%20240%2088%20256%20112%20276%2086%20300%20110%20332%2082Z%27%20fill%3D%27%23fff%27%2F%3E%3Cpath%20d%3D%27M0%20260V215L120%20150%20220%20215%20320%20160%20400%20210V260Z%27%20fill%3D%27%231e3a5f%27%2F%3E%3C%2Fsvg%3E) center/cover,#0284c7","url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20400%20260%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%239cc3d9%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23e0f2fe%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27400%27%20height%3D%27260%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Ccircle%20cx%3D%27310%27%20cy%3D%2770%27%20r%3D%2728%27%20fill%3D%27%23fef9c3%27%20opacity%3D%27.9%27%2F%3E%3Cpath%20d%3D%27M0%20260V170Q120%2090%20240%20150T400%20140V260Z%27%20fill%3D%27%234f7d3a%27%2F%3E%3Cpath%20d%3D%27M0%20260V215Q150%20150%20280%20205T400%20190V260Z%27%20fill%3D%27%232f4a2a%27%2F%3E%3C%2Fsvg%3E) center/cover,#4f7d3a","url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20400%20260%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%2393c5fd%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23fde68a%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27400%27%20height%3D%27260%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Cpath%20d%3D%27M0%20260V160Q100%2070%20210%20150T400%20110V260Z%27%20fill%3D%27%23ea7a2b%27%2F%3E%3Cpath%20d%3D%27M0%20260V215Q130%20140%20260%20215T400%20190V260Z%27%20fill%3D%27%239a3412%27%2F%3E%3C%2Fsvg%3E) center/cover,#ea7a2b","url(data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20400%20260%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%231e1b4b%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%237c3aed%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%27400%27%20height%3D%27260%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Ccircle%20cx%3D%27320%27%20cy%3D%2760%27%20r%3D%2724%27%20fill%3D%27%23fef3c7%27%2F%3E%3Cg%20fill%3D%27%230f0a2a%27%3E%3Crect%20x%3D%2710%27%20y%3D%27150%27%20width%3D%2750%27%20height%3D%27110%27%2F%3E%3Crect%20x%3D%2770%27%20y%3D%27110%27%20width%3D%2740%27%20height%3D%27150%27%2F%3E%3Crect%20x%3D%27120%27%20y%3D%27170%27%20width%3D%2760%27%20height%3D%2790%27%2F%3E%3Crect%20x%3D%27190%27%20y%3D%2795%27%20width%3D%2745%27%20height%3D%27165%27%2F%3E%3Crect%20x%3D%27245%27%20y%3D%27145%27%20width%3D%2755%27%20height%3D%27115%27%2F%3E%3Crect%20x%3D%27310%27%20y%3D%27120%27%20width%3D%2745%27%20height%3D%27140%27%2F%3E%3Crect%20x%3D%27360%27%20y%3D%27170%27%20width%3D%2740%27%20height%3D%2790%27%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%27%23fde047%27%20opacity%3D%27.8%27%3E%3Crect%20x%3D%2780%27%20y%3D%27130%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3Crect%20x%3D%2795%27%20y%3D%27150%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3Crect%20x%3D%27203%27%20y%3D%27115%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3Crect%20x%3D%27215%27%20y%3D%27140%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3Crect%20x%3D%27320%27%20y%3D%27140%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3Crect%20x%3D%27335%27%20y%3D%27165%27%20width%3D%276%27%20height%3D%276%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E) center/cover,#4c1d95"];
function bg(c){return c.photo?`linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.4)),url(${c.photo}) center/cover`:(COLORS[c.color]||COLORS[0])}
const DEF=[
 {id:1,name:"Visa",cat:"Banque",last4:"4821",exp:"2028-09",color:11},
 {id:2,name:"Navigo",cat:"Transport",last4:"",exp:"2027-06",color:12},
 {id:3,name:"Fnac",cat:"Fidélité",last4:"",exp:"",color:13},
 {id:4,name:"Lycée",cat:"Identité",last4:"",exp:"2027-07",color:14}
];
let cards=[],filter="Toutes",view="cards",stack=false;try{stack=localStorage.getItem("pile")==="1"}catch(e){}
try{const s=localStorage.getItem("cartes");cards=s?JSON.parse(s):DEF}catch(e){cards=DEF}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("cartes",JSON.stringify(cards))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(e){if(!e)return"—";const[a,m]=e.split("-");return m+"/"+a}
function st(e){if(!e)return"";const[a,m]=e.split("-"),n=new Date(),d=(a-n.getFullYear())*12+(m-1-n.getMonth());return d<0?"bad":d<3?"warn":""}
function render(){
  $("list").className="list"+(stack&&view==="cards"?" stack":"");$("stBtn").classList.toggle("on",stack);
  const k=cards.length;$("sub").textContent=k+(k>1?" cartes":" carte")+" dans ton portefeuille";
  $("catLbl").textContent=filter;
  $("menu").innerHTML=["Toutes",...CATS].map(c=>`<button class="${c===filter?"sel":""}" data-c="${c}">${c}</button>`).join("");
  $("tCards").classList.toggle("on",view==="cards");$("tDates").classList.toggle("on",view==="dates");
  const l=cards.filter(c=>filter==="Toutes"||c.cat===filter);
  if(!l.length){$("list").innerHTML='<div class="empty">Aucune carte ici.<br>Touche « Ajouter ».</div>';return}
  if(view==="dates"){
    const s=[...l].filter(c=>c.exp).sort((a,b)=>a.exp.localeCompare(b.exp));
    $("list").innerHTML=s.length?s.map(c=>`<div class="row" data-id="${c.id}"><div>${esc(c.name)}<br><small>${c.cat}</small></div><b class="${st(c.exp)}">${fmt(c.exp)}</b></div>`).join(""):'<div class="empty">Aucune date d\'expiration.</div>';
    return}
  $("list").innerHTML=l.map((c,i)=>`<div class="card" data-id="${c.id}" style="animation-delay:${i*60}ms;background:${bg(c)}">${c.cat==="Banque"?'<div class="chip"></div><svg class="nfc" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 8c2.5 2.5 2.5 5.500 0 8M12 5c4.500 4.500 4.500 9.500 0 14M16 2c6 6 6 14 0 20"/></svg>':""}<div class="pill"><span class="nm">${esc(c.name)} · </span>${c.last4?"•••• "+esc(c.last4):c.cat}</div><div class="big">${esc(c.name)}</div></div>`).join("");
}
function open(h){$("panel").innerHTML=h;$("sheet").classList.add("on")}
function close(){$("sheet").classList.remove("on")}
function pvw(){return '<div class="card" id="pv" style="height:130px;margin-bottom:6px;cursor:default"><div class="big" id="pvn" style="font-size:48px"></div></div>'}
function picker(){return `<label>Design</label><div class="sw" id="sw">${COLORS.map((c,i)=>`<span data-i="${i}" style="background:${c}"></span>`).join("")}</div><button class="btn ghost" id="ph" type="button">📷 Utiliser ma photo</button><input id="f" type="file" accept="image/*" hidden>`}
function wire(st,cb){
  const mark=()=>[...$("sw").children].forEach((s,j)=>s.classList.toggle("on",!st.photo&&j==st.color));
  mark();
  $("sw").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;st.color=+i;st.photo="";mark();cb()};
  $("ph").onclick=()=>$("f").click();
  $("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/im.width),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);st.photo=cv.toDataURL("image/jpeg",.7);mark();cb()};im.src=r.result};r.readAsDataURL(f)};
}
function detail(id){
  const c=cards.find(x=>x.id==id);if(!c)return;
  open(`${pvw()}<div class="d"><span>Catégorie</span><span>${c.cat}</span></div><div class="d"><span>4 derniers chiffres</span><span>${c.last4?"•••• "+esc(c.last4):"—"}</span></div><div class="d"><span>Expiration</span><span>${fmt(c.exp)}</span></div><button class="btn ghost" id="ds">🎨 Changer le design</button><button class="btn red" id="del">Supprimer</button><button class="btn" id="cl">Fermer</button>`);
  $("pv").style.background=bg(c);$("pvn").textContent=c.name;
  $("ds").onclick=()=>design(id);
  $("del").onclick=()=>{cards=cards.filter(x=>x.id!=id);save();close();render()};
  $("cl").onclick=close;
}
function design(id){
  const c=cards.find(x=>x.id==id),st={color:c.color,photo:c.photo||""};
  open(`<h2>Design</h2>${pvw()}${picker()}<button class="btn" id="ok">Enregistrer</button>`);
  const upd=()=>{$("pv").style.background=bg(st);$("pvn").textContent=c.name};
  wire(st,upd);upd();
  $("ok").onclick=()=>{c.color=st.color;c.photo=st.photo;save();close();render()};
}
function add(){
  const st={color:0,photo:""};
  open(`<h2>Nouvelle carte</h2>${pvw()}<label>Nom</label><input id="n" maxlength="14" placeholder="Ex : Visa"><label>Catégorie</label><select id="k">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><label>4 derniers chiffres (facultatif)</label><input id="l" inputmode="numeric" maxlength="4" placeholder="1234"><label>Expiration (facultatif)</label><input id="e" type="month">${picker()}<div class="note">Pour ta sécurité, n'entre jamais le numéro complet, le CVV ou le code PIN : seuls les 4 derniers chiffres sont acceptés.</div><button class="btn" id="ok">Ajouter</button>`);
  const upd=()=>{$("pv").style.background=bg(st);$("pvn").textContent=$("n").value||"Nom"};
  wire(st,upd);$("n").oninput=upd;upd();
  $("ok").onclick=()=>{
    const n=$("n").value.trim();if(!n){$("n").focus();return}
    cards.unshift({id:Date.now(),name:n,cat:$("k").value,last4:$("l").value.replace(/\D/g,"").slice(0,4),exp:$("e").value,color:st.color,photo:st.photo});
    save();close();view="cards";render()};
}
$("catBtn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("on")};
$("menu").onclick=e=>{const c=e.target.dataset.c;if(c){filter=c;$("menu").classList.remove("on");render()}};
document.addEventListener("click",()=>$("menu").classList.remove("on"));
$("list").onclick=e=>{const el=e.target.closest("[data-id]");if(el)detail(el.dataset.id)};
$("sheet").onclick=e=>{if(e.target===$("sheet"))close()};
$("calBtn").onclick=$("tDates").onclick=()=>{view="dates";render()};
$("tCards").onclick=()=>{view="cards";render()};
$("tAdd").onclick=add;
$("stBtn").onclick=()=>{stack=!stack;view="cards";try{localStorage.setItem("pile",stack?"1":"0")}catch(e){}render()};
$("list").addEventListener("pointermove",e=>{const el=e.target.closest(".card");if(!el||stack||e.pointerType==="touch")return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg)`});
$("list").addEventListener("pointerleave",e=>{const el=e.target.closest&&e.target.closest(".card");if(el)el.style.transform=""},true);
render();
</script>
</body>
</html>
